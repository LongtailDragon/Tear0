name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --extra test
      - name: Run tests
        run: uv run pytest -q
      - name: Public readiness check
        run: uv run python scripts/public_readiness_check.py
